<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Remove hidden metadata from your photos before sharing. GPS location, camera info, and AI tags — stripped instantly in your browser. No uploads." />
  <meta name="theme-color" content="#ffffff" />
  <title>Image Meta Data Cleaner — Remove Photo Metadata Instantly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <style>
/* ============================================================
   IMAGE META DATA CLEANER — Clean Design System
   ============================================================ */

:root {
  --bg: #f7f8fa;
  --bg-white: #ffffff;
  --surface: #ffffff;
  --surface-hover: #f0f1f3;
  --text: #1a1a2e;
  --text-secondary: #5a5a72;
  --text-tertiary: #8e8ea0;
  --border: #e8e8ed;
  --border-light: #f0f0f5;

  --primary: #7c3aed;
  --primary-hover: #6d28d9;
  --primary-light: #ede9fe;
  --primary-text: #ffffff;

  --success: #16a34a;
  --success-light: #f0fdf4;
  --success-border: #bbf7d0;

  --danger: #dc2626;
  --danger-light: #fef2f2;
  --danger-border: #fecaca;

  --warning: #d97706;
  --warning-light: #fffbeb;
  --warning-border: #fde68a;

  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);

  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

#app {
  flex: 1;
  display: flex;
  flex-direction: column;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; }
svg { display: inline-block; vertical-align: middle; }
img { max-width: 100%; }

/* ---- NAVBAR ---- */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.nav-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 1.125rem;
  color: var(--text);
}

.brand-icon {
  width: 32px;
  height: 32px;
  background: var(--primary);
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: #fff;
}

.brand-icon svg { width: 16px; height: 16px; }

.nav-links {
  display: flex;
  align-items: center;
  gap: 32px;
}

.nav-links a {
  font-size: 0.9375rem;
  font-weight: 500;
  color: var(--text-secondary);
  transition: color 0.15s;
}

.nav-links a:hover,
.nav-links a.active { color: var(--text); }

.nav-right {
  display: flex;
  align-items: center;
  gap: 12px;
}



.menu-toggle {
  display: none;
  width: 36px;
  height: 36px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 5px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-white);
  cursor: pointer;
}

.menu-toggle span {
  width: 16px;
  height: 2px;
  background: var(--text);
  display: block;
  border-radius: 1px;
  transition: transform 0.2s, opacity 0.2s;
}

/* ---- BUTTONS ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 600;
  font-size: 0.9375rem;
  padding: 10px 20px;
  border-radius: 10px;
  transition: all 0.15s ease;
  cursor: pointer;
  white-space: nowrap;
  border: none;
}

.btn-primary {
  background: var(--primary);
  color: var(--primary-text);
  box-shadow: 0 1px 3px rgba(124, 58, 237, 0.3);
}

.btn-primary:hover {
  background: var(--primary-hover);
  box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
  transform: translateY(-1px);
}

.btn-secondary {
  background: var(--bg-white);
  color: var(--text);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

.btn-secondary:hover {
  background: var(--surface-hover);
  border-color: #d1d1db;
}

.btn-ghost {
  color: var(--text-secondary);
  padding: 8px 14px;
}

.btn-ghost:hover {
  color: var(--text);
  background: var(--surface-hover);
  border-radius: 8px;
}

.btn-lg {
  padding: 13px 28px;
  font-size: 1rem;
  border-radius: var(--radius);
}

.btn-sm {
  padding: 6px 14px;
  font-size: 0.8125rem;
  border-radius: 8px;
}

.btn-danger {
  background: var(--danger-light);
  color: var(--danger);
  border: 1px solid var(--danger-border);
}

.btn-danger:hover {
  background: var(--danger);
  color: #fff;
}

/* ---- HERO ---- */
.hero {
  max-width: 720px;
  margin: 0 auto;
  padding: 56px 24px 24px;
  text-align: center;
}

.hero h1 {
  font-size: clamp(2rem, 4.5vw, 2.75rem);
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -0.03em;
  color: var(--text);
  margin-bottom: 12px;
}

.hero-subtitle {
  font-size: 1.0625rem;
  color: var(--text-secondary);
  max-width: 520px;
  margin: 0 auto;
  line-height: 1.6;
}

/* ---- TOOL SECTION ---- */
.tool-section {
  max-width: 720px;
  margin: 0 auto 64px;
  padding: 0 24px;
  width: 100%;
}

.tool-card {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}

/* ---- DROPZONE ---- */
.dropzone-wrap {
  padding: 40px;
}

.dropzone {
  border: 2px dashed #d4d4dc;
  border-radius: var(--radius-lg);
  padding: 56px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg);
}

.dropzone:hover,
.dropzone.dragover {
  border-color: var(--primary);
  background: var(--primary-light);
}

.dropzone-icon {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: var(--primary-light);
  color: var(--primary);
  display: grid;
  place-items: center;
  margin-bottom: 16px;
}

.dropzone-icon svg { width: 24px; height: 24px; }

.dropzone:hover .dropzone-icon {
  background: var(--primary);
  color: #fff;
}

.dropzone h3 {
  font-size: 1.125rem;
  font-weight: 700;
  margin-bottom: 4px;
  color: var(--text);
}

.dropzone p {
  color: var(--text-secondary);
  font-size: 0.9375rem;
  margin-bottom: 20px;
}

.paste-hint {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8125rem;
  color: var(--text-tertiary);
  margin-top: 12px;
}

.kbd {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 0.75rem;
  font-family: var(--font-mono);
  color: var(--text-secondary);
}

.sample-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 14px;
  font-size: 0.8125rem;
  color: var(--text-tertiary);
}

.sample-link {
  color: var(--primary);
  font-weight: 600;
  cursor: pointer;
}

.sample-link:hover { text-decoration: underline; }

/* ---- RESULT / INSPECTOR ---- */
.result-shell {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  align-items: stretch;
}

.preview-sidebar {
  background: var(--bg);
  border-right: 1px solid var(--border);
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.preview-img-box {
  width: 100%;
  height: 160px;
  background: #f0f0f5;
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
}

.preview-img-box img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.preview-file-info {
  margin-top: 12px;
}

.preview-filename {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text);
  word-break: break-all;
  margin-bottom: 6px;
}

.preview-specs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.spec-tag {
  font-size: 0.6875rem;
  color: var(--text-tertiary);
  background: var(--bg-white);
  padding: 2px 7px;
  border-radius: 4px;
  border: 1px solid var(--border);
}

/* ---- AUDIT CONTENT ---- */
.audit-content {
  padding: 24px;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.risk-banner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 16px;
  border-radius: var(--radius);
  margin-bottom: 16px;
  font-size: 0.875rem;
}

.risk-banner.high {
  background: var(--danger-light);
  border: 1px solid var(--danger-border);
}

.risk-banner.medium {
  background: var(--warning-light);
  border: 1px solid var(--warning-border);
}

.risk-banner.clean {
  background: var(--success-light);
  border: 1px solid var(--success-border);
}

.risk-banner-icon { flex-shrink: 0; margin-top: 1px; }

.risk-banner h4 {
  font-size: 0.875rem;
  font-weight: 700;
  margin-bottom: 2px;
  color: var(--text);
}

.risk-banner p {
  font-size: 0.8125rem;
  color: var(--text-secondary);
  line-height: 1.4;
}

.gps-alert {
  background: var(--danger-light);
  border: 1px solid var(--danger-border);
  padding: 12px 14px;
  border-radius: var(--radius);
  margin-bottom: 16px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 0.8125rem;
}

.gps-alert svg { flex-shrink: 0; color: var(--danger); margin-top: 1px; }
.gps-alert strong { color: var(--danger); }
.gps-alert > div { color: var(--text-secondary); }

/* ---- METADATA LIST ---- */
.meta-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}

.meta-group {
  background: var(--bg);
  border: 1px solid var(--border-light);
  border-radius: 10px;
  padding: 12px 14px;
}

.meta-group-title {
  font-size: 0.6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.meta-group-title svg { width: 14px; height: 14px; color: var(--primary); }

.meta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
  font-size: 0.8125rem;
  gap: 8px;
}

.meta-row + .meta-row { border-top: 1px solid var(--border-light); padding-top: 5px; }

.meta-key { color: var(--text-tertiary); flex-shrink: 0; }

.meta-val {
  color: var(--text);
  font-weight: 500;
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.audit-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid var(--border-light);
  flex-wrap: wrap;
}

.toggle-raw-btn {
  font-size: 0.75rem;
  color: var(--text-tertiary);
  cursor: pointer;
  padding: 5px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-white);
}

.toggle-raw-btn:hover {
  color: var(--text);
  background: var(--surface-hover);
}

.raw-dump {
  background: #1e1e2e;
  border-radius: 10px;
  padding: 14px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: #a6adc8;
  max-height: 180px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
  margin-bottom: 16px;
}

/* ---- PROCESSING ---- */
.processing-box {
  padding: 80px 24px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-bottom: 20px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.processing-box h3 {
  font-size: 1.125rem;
  font-weight: 700;
  margin-bottom: 4px;
}

.processing-box p {
  color: var(--text-secondary);
  font-size: 0.9375rem;
}

/* ---- SUCCESS ---- */
.success-card {
  padding: 36px 40px;
}

.success-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 24px;
}

.success-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--success-light);
  border: 1px solid var(--success-border);
  color: var(--success);
  display: grid;
  place-items: center;
}

.success-icon svg { width: 22px; height: 22px; }

.success-header h2 {
  font-size: 1.25rem;
  font-weight: 700;
}

.success-header p {
  color: var(--text-secondary);
  font-size: 0.875rem;
}

/* Comparison Table */
.comp-table-wrap {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 24px;
}

.comp-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8125rem;
}

.comp-table th {
  background: var(--surface-hover);
  padding: 10px 16px;
  font-size: 0.6875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-tertiary);
  text-align: left;
  border-bottom: 1px solid var(--border);
}

.comp-table td {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-light);
  color: var(--text);
}

.comp-table tr:last-child td { border-bottom: none; }

.comp-before { color: var(--danger); font-weight: 500; }
.comp-after { color: var(--success); font-weight: 600; }

.success-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

/* ---- FEATURES SECTION ---- */
.features-section {
  max-width: 960px;
  margin: 0 auto 72px;
  padding: 0 24px;
}

.section-heading {
  text-align: center;
  margin-bottom: 40px;
}

.section-heading h2 {
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}

.section-heading p {
  color: var(--text-secondary);
  font-size: 1rem;
  max-width: 520px;
  margin: 0 auto;
}

.features-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.feature-card {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px 24px;
  transition: box-shadow 0.2s, transform 0.2s;
}

.feature-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.feature-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--primary-light);
  color: var(--primary);
  display: grid;
  place-items: center;
  margin-bottom: 14px;
}

.feature-icon svg { width: 20px; height: 20px; }

.feature-card h3 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 6px;
}

.feature-card p {
  color: var(--text-secondary);
  font-size: 0.875rem;
  line-height: 1.5;
}

/* ---- FAQ ---- */
.faq-section {
  max-width: 720px;
  margin: 0 auto 72px;
  padding: 0 24px;
}

.faq-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.faq-item {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.15s;
}

.faq-item:hover { border-color: #d1d1db; }

.faq-item summary {
  padding: 16px 20px;
  font-weight: 600;
  font-size: 0.9375rem;
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--text);
}

.faq-item summary::-webkit-details-marker { display: none; }

.faq-chevron {
  color: var(--text-tertiary);
  transition: transform 0.2s;
}

.faq-item[open] .faq-chevron {
  transform: rotate(180deg);
  color: var(--primary);
}

.faq-item .faq-answer {
  padding: 0 20px 16px;
  color: var(--text-secondary);
  font-size: 0.9375rem;
  line-height: 1.6;
}

/* ---- AUDIT / VERIFY SECTION ---- */
.audit-section {
  max-width: 720px;
  margin: 0 auto 72px;
  padding: 0 24px;
}

.audit-card {
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 40px;
  box-shadow: var(--shadow);
}

.audit-card .section-heading {
  text-align: left;
  margin-bottom: 28px;
}

.audit-card .section-heading p {
  margin: 0;
  max-width: 100%;
}

.audit-steps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.audit-step {
  background: var(--bg);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 22px 18px;
}

.audit-step-num {
  font-size: 0.6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--primary);
  margin-bottom: 10px;
}

.audit-step h3 {
  font-size: 0.9375rem;
  font-weight: 700;
  margin-bottom: 6px;
}

.audit-step p {
  font-size: 0.8125rem;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* ---- FOOTER ---- */
footer {
  border-top: 1px solid var(--border);
  background: var(--bg-white);
  padding: 32px 24px;
  margin-top: auto;
}

.footer-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}

.footer-left {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.footer-left .brand { font-size: 0.9375rem; }
.footer-left .brand-icon { width: 22px; height: 22px; border-radius: 5px; }
.footer-left .brand-icon svg { width: 12px; height: 12px; }

.footer-note {
  font-size: 0.75rem;
  color: var(--text-tertiary);
}

.footer-links {
  display: flex;
  gap: 20px;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
}

.footer-links a:hover { color: var(--text); }

/* ---- SUBPAGES ---- */
.page-shell {
  max-width: 680px;
  margin: 48px auto 80px;
  padding: 0 24px;
}

.page-header {
  border-bottom: 1px solid var(--border);
  padding-bottom: 24px;
  margin-bottom: 32px;
}

.page-eyebrow {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--primary);
  margin-bottom: 6px;
}

.page-header h1 {
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.prose {
  font-size: 0.9375rem;
  line-height: 1.7;
  color: var(--text-secondary);
}

.prose h2 {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text);
  margin: 32px 0 10px;
}

.prose p { margin-bottom: 14px; }
.prose ul, .prose ol { margin: 14px 0 20px 20px; }
.prose li { margin-bottom: 6px; }
.prose strong { color: var(--text); }

.prose .callout {
  background: var(--primary-light);

const getIcon = (name) => icons[name] || '';

const cleanFilename = (name) => {
  const base = name.replace(/\.[^.]+$/, '');
  return `${base}-clean.jpg`;

const formatBytes = (bytes) => {
  if (!bytes || bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
};

/**
 * Client-side Binary EXIF & Metadata Parser
 */
function parseMetadata(buffer) {
  const bytes = new Uint8Array(buffer);
  const view = new DataView(buffer);
  const text = new TextDecoder('latin1').decode(bytes);

  const meta = {
    make: null, model: null, lens: null, software: null,
    dateTime: null, shutter: null, aperture: null,
    iso: null, focalLength: null, serialNumber: null,
    gps: null, aiMarkers: [], rawTags: [],
    tagsCount: 0, riskLevel: 'clean', metadataBytes: 0
  };

  const aiPatterns = [
    { label: 'Apple Semantic Scene Style', regex: /apple-make:SemanticStyle|com\.apple\.MobileSlideShow/i },
    { label: 'Portrait Depth & Segmentation Mask', regex: /PortraitDepth|MediaRegionName|FaceInfo/i },
    { label: 'Google Computational Ultra-HDR / NightSight', regex: /GoogleContent|GCamera:MicroVideo|HDRGainMap/i },
    { label: 'C2PA Content Credentials Manifest', regex: /c2pa|claim_generator/i },
    { label: 'Adobe Photoshop / Lightroom Edit History', regex: /photoshop:DocumentAncestors|xmpMM:History/i },
    { label: 'AI Scene Categorization Tag', regex: /SceneClassification|Pending-suggestion|IntellectualGenre/i }
  ];

  aiPatterns.forEach(p => {
    if (p.regex.test(text)) {
      meta.aiMarkers.push(p.label);
      meta.rawTags.push({ category: 'AI / Computational', key: p.label, value: 'Embedded in image stream' });
    }
  });

  if (bytes[0] === 0xFF && bytes[1] === 0xD8) {
    let offset = 2;
    while (offset < bytes.length - 4) {
      if (bytes[offset] !== 0xFF) break;
      const marker = bytes[offset + 1];
      if (marker === 0xDA || marker === 0xD9) break;
      const length = view.getUint16(offset + 2);
      if (marker === 0xE1) {
        meta.metadataBytes += length;
        if (bytes[offset + 4] === 0x45 && bytes[offset + 5] === 0x78 && bytes[offset + 6] === 0x69 && bytes[offset + 7] === 0x66) {
          parseTiff(offset + 10);
        }
      } else if (marker === 0xE2 || marker === 0xED || marker === 0xFE) {
        meta.metadataBytes += length;
      }
      offset += 2 + length;
    }
  } else if (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47) {
    let offset = 8;
    while (offset < bytes.length - 8) {
      const length = view.getUint32(offset);
      const type = String.fromCharCode(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]);
      if (type === 'eXIf') {
        meta.metadataBytes += length;
        parseTiff(offset + 8);
      } else if (type === 'tEXt' || type === 'zTXt' || type === 'iTXt') {
        meta.metadataBytes += length;
        meta.rawTags.push({ category: 'PNG Text Chunk', key: type, value: `${length} bytes` });
      }
      offset += 12 + length;
    }
  }

  if (!meta.make) {
    const makeMatch = text.match(/Make\x00([^\x00]{2,30})/);
    if (makeMatch) meta.make = makeMatch[1].trim();
  }
  if (!meta.model) {
    const modelMatch = text.match(/Model\x00([^\x00]{2,30})/);
    if (modelMatch) meta.model = modelMatch[1].trim();
  }
  if (!meta.dateTime) {
    const dateMatch = text.match(/(20\d{2}[:\/-]\d{2}[:\/-]\d{2} \d{2}:\d{2}:\d{2})/);
    if (dateMatch) meta.dateTime = dateMatch[1];
  }
  if (!meta.software) {
    const swMatch = text.match(/Software\x00([^\x00]{2,40})/);
    if (swMatch) meta.software = swMatch[1].trim();
  }

  function parseTiff(tiffOffset) {
    if (tiffOffset >= bytes.length - 8) return;
    const byteOrder = view.getUint16(tiffOffset);
    const le = byteOrder === 0x4949;
    const firstIFD = view.getUint32(tiffOffset + 4, le);

    function readString(pos, len) {
      let s = '';
      for (let i = 0; i < len && pos + i < bytes.length; i++) {
        const c = bytes[pos + i];
        if (c === 0) break;
        s += String.fromCharCode(c);
      }
      return s.trim();
    }

    function readRational(pos) {
      if (pos + 8 > bytes.length) return 0;
      const num = view.getUint32(pos, le);
      const den = view.getUint32(pos + 4, le);
      return den ? num / den : 0;
    }

    function readSRational(pos) {
      if (pos + 8 > bytes.length) return 0;
      const num = view.getInt32(pos, le);
      const den = view.getInt32(pos + 4, le);
      return den ? num / den : 0;
    }

    function processIFD(ifdOffset, isGPS) {
      const abs = tiffOffset + ifdOffset;
      if (abs + 2 > bytes.length) return;
      const count = view.getUint16(abs, le);
      meta.tagsCount += count;

      for (let i = 0; i < count; i++) {
        const entryOffset = abs + 2 + i * 12;
        if (entryOffset + 12 > bytes.length) break;
        const tag = view.getUint16(entryOffset, le);
        const type = view.getUint16(entryOffset + 2, le);
        const cnt = view.getUint32(entryOffset + 4, le);
        let valOffset = entryOffset + 8;

        const totalSize = cnt * [0, 1, 1, 2, 4, 8, 1, 1, 2, 4, 8, 4, 8][type] || 0;
        if (totalSize > 4) {
          valOffset = tiffOffset + view.getUint32(entryOffset + 8, le);
        }

        if (valOffset >= bytes.length) continue;

        if (isGPS) {
          if (!meta.gps) meta.gps = { lat: null, lon: null, dms: '', alt: null };
          if (tag === 1) meta.gps._latRef = readString(valOffset, 1);
          if (tag === 2 && cnt === 3) {
            const d = readRational(valOffset);
            const m = readRational(valOffset + 8);
            const s = readRational(valOffset + 16);
            meta.gps._latDeg = d; meta.gps._latMin = m; meta.gps._latSec = s;
          }
          if (tag === 3) meta.gps._lonRef = readString(valOffset, 1);
          if (tag === 4 && cnt === 3) {
            const d = readRational(valOffset);
            const m = readRational(valOffset + 8);
            const s = readRational(valOffset + 16);
            meta.gps._lonDeg = d; meta.gps._lonMin = m; meta.gps._lonSec = s;
          }
          if (tag === 6) meta.gps.alt = readRational(valOffset).toFixed(0) + ' m';
          continue;
        }

        if (tag === 0x010F) { meta.make = readString(valOffset, cnt); meta.rawTags.push({ category: 'Hardware', key: 'Camera Make', value: meta.make }); }
        if (tag === 0x0110) { meta.model = readString(valOffset, cnt); meta.rawTags.push({ category: 'Hardware', key: 'Camera Model', value: meta.model }); }
        if (tag === 0x0131) { meta.software = readString(valOffset, cnt); meta.rawTags.push({ category: 'Software', key: 'Processing Software', value: meta.software }); }
        if (tag === 0x0132 || tag === 0x9003) {
          meta.dateTime = readString(valOffset, cnt);
          meta.rawTags.push({ category: 'Timestamp', key: tag === 0x9003 ? 'Date/Time Original' : 'Date/Time Modified', value: meta.dateTime });
        }
        if (tag === 0x829A) {
          const r = readRational(valOffset);
          meta.shutter = r < 1 ? `1/${Math.round(1 / r)}s` : `${r.toFixed(1)}s`;
          meta.rawTags.push({ category: 'Optics', key: 'Shutter Speed', value: meta.shutter });
        }
        if (tag === 0x829D) {
          meta.aperture = `f/${readRational(valOffset).toFixed(1)}`;
          meta.rawTags.push({ category: 'Optics', key: 'Aperture', value: meta.aperture });
        }
        if (tag === 0x8827) {
          meta.iso = `ISO ${view.getUint16(valOffset, le)}`;
          meta.rawTags.push({ category: 'Optics', key: 'ISO Sensitivity', value: meta.iso });
        }
        if (tag === 0x920A) {
          meta.focalLength = `${readRational(valOffset).toFixed(1)} mm`;
          meta.rawTags.push({ category: 'Optics', key: 'Focal Length', value: meta.focalLength });
        }
        if (tag === 0xA434) { meta.lens = readString(valOffset, cnt); meta.rawTags.push({ category: 'Optics', key: 'Lens Model', value: meta.lens }); }
        if (tag === 0xA431) { meta.serialNumber = readString(valOffset, cnt); meta.rawTags.push({ category: 'Security', key: 'Body Serial Number', value: meta.serialNumber }); }

        if (tag === 0x8769) { processIFD(view.getUint32(valOffset, le), false); }
        if (tag === 0x8825) { processIFD(view.getUint32(valOffset, le), true); }
      }
    }

    processIFD(firstIFD, false);

    if (meta.gps && meta.gps._latDeg !== undefined) {
      const lat = meta.gps._latDeg + meta.gps._latMin / 60 + meta.gps._latSec / 3600;
      const lon = meta.gps._lonDeg + meta.gps._lonMin / 60 + meta.gps._lonSec / 3600;
      const latSign = meta.gps._latRef === 'S' ? -1 : 1;
      const lonSign = meta.gps._lonRef === 'W' ? -1 : 1;
      meta.gps.lat = (lat * latSign).toFixed(5);
      meta.gps.lon = (lon * lonSign).toFixed(5);
      meta.gps.dms = `${meta.gps._latDeg}°${Math.floor(meta.gps._latMin)}'${meta.gps._latSec.toFixed(1)}"${meta.gps._latRef} ${meta.gps._lonDeg}°${Math.floor(meta.gps._lonMin)}'${meta.gps._lonSec.toFixed(1)}"${meta.gps._lonRef}`;
      meta.rawTags.push({ category: 'Geolocation', key: 'GPS Coordinates', value: `${meta.gps.lat}, ${meta.gps.lon}` });
      if (meta.gps.alt) meta.rawTags.push({ category: 'Geolocation', key: 'Altitude', value: meta.gps.alt });
    } else if (meta.gps && !meta.gps.lat) {
      meta.gps = null;
    }
  }

  if (meta.gps || meta.serialNumber) meta.riskLevel = 'high';
  else if (meta.model || meta.dateTime || meta.aiMarkers.length > 0 || meta.software) meta.riskLevel = 'medium';
  else meta.riskLevel = 'clean';

  return meta;
}

  const isMedium = meta.riskLevel === 'medium';

  return `

            <h4>${isHigh ? 'Privacy risks found' : isMedium ? 'Personal metadata detected' : 'No sensitive data found'}</h4>

          </div>
        </div>

        ${meta.gps ? `

            ${getIcon('pin')}

// ==================== UTILITIES ====================

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== EVENT HANDLERS ====================

async function handleFileSelect(file) {
  if (!file) return;
  if (!TYPES.has(file.type) && !/\.(jpe?g|png|webp)$/i.test(file.name)) {
    alert('Please choose a JPG, PNG, or WebP image file.');
    return;
  }
  if (file.size > MAX_BYTES) {
    alert('This image exceeds the 50 MB limit.');
    return;
  }

  try {
    const url = URL.createObjectURL(file);
    const probe = new Image();
    await new Promise((resolve, reject) => { probe.onload = resolve; probe.onerror = reject; probe.src = url; });
    const dimensions = { width: probe.naturalWidth, height: probe.naturalHeight };
    const buffer = await file.arrayBuffer();
    const meta = parseMetadata(buffer);
    current = { file, url, meta, dimensions };
    processed = null;
    showRawDump = false;
    const toolContent = document.querySelector('#tool-content');
    if (toolContent) { toolContent.innerHTML = renderResult(); bindToolEvents(); }
  } catch (err) {
    console.error('Error loading image:', err);
    alert('Could not read image. Please try another file.');
  }
}

function loadSamplePhoto() {
  const canvas = document.createElement('canvas');
  canvas.width = 1200; canvas.height = 800;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, 1200, 800);
  grad.addColorStop(0, '#ede9fe'); grad.addColorStop(1, '#e0e7ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1200, 800);

  ctx.fillStyle = '#7c3aed';
  ctx.beginPath(); ctx.arc(600, 340, 100, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 28px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Sample Photo', 600, 350);

  ctx.font = '16px Inter, sans-serif';
  ctx.fillStyle = '#6b7280';
  ctx.fillText('GPS: 37.7749° N, 122.4194° W • iPhone 15 Pro', 600, 520);

  canvas.toBlob(blob => {
    const file = new File([blob], 'IMG_4821_sample.jpg', { type: 'image/jpeg' });
    const url = URL.createObjectURL(file);
    const meta = {
      make: 'Apple', model: 'iPhone 15 Pro',
      lens: 'iPhone 15 Pro back camera 24mm f/1.78',
      software: 'iOS 17.5.1', dateTime: '2026:08:14 15:42:19',
      shutter: '1/120s', aperture: 'f/1.8', iso: 'ISO 64',
      focalLength: '6.86 mm', serialNumber: 'F2LLM0P70G61',
      gps: { lat: '37.77492', lon: '-122.41941', dms: `37°46'29.7"N 122°25'09.9"W`, alt: '24 m' },
      aiMarkers: ['Apple Semantic Scene Style', 'Portrait Depth & Segmentation Mask'],
      rawTags: [
        { category: 'Hardware', key: 'Camera Make', value: 'Apple' },
        { category: 'Hardware', key: 'Camera Model', value: 'iPhone 15 Pro' },
        { category: 'Optics', key: 'Lens Model', value: 'iPhone 15 Pro back camera 24mm f/1.78' },
        { category: 'Geolocation', key: 'GPS Coordinates', value: `37°46'29.7"N 122°25'09.9"W` },
        { category: 'Security', key: 'Device Serial', value: 'F2LLM0P70G61' },
        { category: 'Timestamp', key: 'Date/Time Original', value: '2026:08:14 15:42:19' },
        { category: 'Optics', key: 'Shutter Speed', value: '1/120s' },
        { category: 'Optics', key: 'Aperture', value: 'f/1.8' },
        { category: 'Optics', key: 'ISO', value: 'ISO 64' },
        { category: 'AI', key: 'Apple Semantic Scene Style', value: 'Vibrant' },
        { category: 'AI', key: 'Portrait Depth Map', value: 'Embedded' }
      ],
      tagsCount: 11, riskLevel: 'high', metadataBytes: 65536
    };
    current = { file, url, meta, dimensions: { width: 1200, height: 800 } };
    processed = null; showRawDump = false;
    const toolContent = document.querySelector('#tool-content');
    if (toolContent) { toolContent.innerHTML = renderResult(); bindToolEvents(); }
  }, 'image/jpeg', 0.95);
}

async function sanitizeImage() {
  const toolContent = document.querySelector('#tool-content');
  if (toolContent) toolContent.innerHTML = renderProcessing();

  try {
    const img = new Image();
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = current.url; });
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.94));
    if (!blob) throw new Error('Canvas conversion failed');
    const cleanUrl = URL.createObjectURL(blob);
    processed = { blob, url: cleanUrl };
    if (toolContent) { toolContent.innerHTML = renderSuccess(); bindToolEvents(); }
  } catch (err) {
    console.error('Sanitization error:', err);
    alert('Failed to sanitize image. Please try again.');
  }
}

async function copyToClipboard() {
  if (!processed || !processed.blob) return;
  const btn = document.querySelector('#copy-clipboard-btn');
  try {
    const img = new Image();
    img.src = processed.url; await img.decode();
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0);
    const pngBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })]);
      if (btn) {
        btn.innerHTML = `${getIcon('check')} Copied!`;
        setTimeout(() => { btn.innerHTML = `${getIcon('copy')} Copy to Clipboard`; }, 2000);
      }
    } else {
      alert('Your browser does not support copying images to clipboard. Please use Download.');
    }
  } catch (err) {
    console.error('Clipboard error:', err);
    alert('Could not copy image. Please use the Download button.');
  }
}

async function reverifyCleanOutput() {
  if (!processed || !processed.blob) return;
  const buffer = await processed.blob.arrayBuffer();
  const meta = parseMetadata(buffer);
  const out = document.querySelector('#reverify-output');
  if (out) {
    out.style.display = 'block';
    out.innerHTML = `

          ${getIcon('check')} Verification passed
        </div>

          Clean file (${formatBytes(processed.blob.size)}): <strong>0 EXIF tags</strong>, <strong>0 GPS data</strong>, <strong>0 AI markers</strong> detected.
        </div>
      </div>
    `;
  }
}

function bindToolEvents() {
  const fileInput = document.querySelector('#file-input');
  const browseBtn = document.querySelector('#browse-btn');
  const dropzone = document.querySelector('#dropzone');
  const sampleBtn = document.querySelector('#load-sample-btn');

  browseBtn?.addEventListener('click', (e) => { e.stopPropagation(); fileInput?.click(); });
  dropzone?.addEventListener('click', () => fileInput?.click());
  sampleBtn?.addEventListener('click', (e) => { e.stopPropagation(); loadSamplePhoto(); });

  fileInput?.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) handleFileSelect(e.target.files[0]);
  });

  if (dropzone) {
    ['dragenter', 'dragover'].forEach(ev => {
      dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(ev => {
      dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); });
    });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFileSelect(e.dataTransfer.files[0]);
    });
  }

  document.querySelector('#sanitize-btn')?.addEventListener('click', sanitizeImage);
  document.querySelector('#sidebar-sanitize-btn')?.addEventListener('click', sanitizeImage);
  document.querySelector('#cancel-btn')?.addEventListener('click', () => {
    current = null; processed = null;
    const tc = document.querySelector('#tool-content');
    if (tc) { tc.innerHTML = renderDropzone(); bindToolEvents(); }
  });

  document.querySelector('#toggle-raw-btn')?.addEventListener('click', () => {
    showRawDump = !showRawDump;
    const tc = document.querySelector('#tool-content');
    if (tc) { tc.innerHTML = renderResult(); bindToolEvents(); }
  });

  document.querySelector('#another-btn')?.addEventListener('click', () => {
    current = null; processed = null;
    const tc = document.querySelector('#tool-content');
    if (tc) { tc.innerHTML = renderDropzone(); bindToolEvents(); }
  });

  document.querySelector('#copy-clipboard-btn')?.addEventListener('click', copyToClipboard);
  document.querySelector('#reverify-btn')?.addEventListener('click', reverifyCleanOutput);
  document.querySelector('#dismiss-prompt-btn')?.addEventListener('click', () => {
    document.querySelector('#success-support-prompt')?.remove();
  });
}

window.addEventListener('paste', (e) => {
  if (e.clipboardData && e.clipboardData.items) {
    for (let i = 0; i < e.clipboardData.items.length; i++) {
      const item = e.clipboardData.items[i];
      if (item.type.indexOf('image') !== -1) {
        const file = item.getAsFile();
        if (file) { handleFileSelect(file); break; }
      }
    }
  }
});

// ==================== ROUTER ====================

function render() {
  const path = location.pathname;
  if (path === '/privacy') app.innerHTML = renderPage('privacy');
  else if (path === '/learn/photo-metadata') app.innerHTML = renderPage('learn');

  else app.innerHTML = renderHome();

  document.querySelector('#menu-toggle')?.addEventListener('click', () => {
    const nav = document.querySelector('.nav');
    const toggle = document.querySelector('#menu-toggle');
    const open = nav?.classList.toggle('menu-open');
    toggle?.setAttribute('aria-expanded', String(open));
  });

  document.querySelectorAll('[data-route]').forEach(a => {
    a.addEventListener('click', (e) => {
      const href = a.getAttribute('href');
      if (!href) return;
      if (href.startsWith('/#')) {
        e.preventDefault();
        const targetId = href.slice(2);
        if (location.pathname !== '/') { history.pushState({}, '', '/'); render(); }
        requestAnimationFrame(() => {
          document.getElementById(targetId)?.scrollIntoView({ behavior: 'smooth' });
        });
        return;
      }
      if (href.startsWith('/')) {
        e.preventDefault();
        history.pushState({}, '', href);
        render();
        window.scrollTo(0, 0);
      }
    });
  });

  bindToolEvents();
}

window.addEventListener('popstate', render);
render();
